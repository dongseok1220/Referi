name: Replace ReFeri crops

on:
  push:
    paths:
      - ".github/workflows/replace-crops.yml"

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow

      - name: Render camera-ready pages
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/referi.pdf https://arxiv.org/pdf/2506.17251v3
          mkdir -p /tmp/render
          for p in 5 6 7 8; do
            pdftoppm -f "$p" -singlefile -r 300 -png /tmp/referi.pdf "/tmp/render/page$p" >/dev/null 2>&1
          done

      - name: Crop exact figure regions
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          crops = {
              "table1.png":  ("/tmp/render/page5.png", (288, 521, 2192, 1662)),
              "figure2.png": ("/tmp/render/page6.png", (280, 280, 2206, 813)),
              "figure3.png": ("/tmp/render/page6.png", (1266, 1587, 2196, 2000)),
              "figure4.png": ("/tmp/render/page7.png", (294, 297, 1211, 705)),
              "figure5.png": ("/tmp/render/page7.png", (1272, 739, 2187, 1108)),
              "figure6.png": ("/tmp/render/page8.png", (276, 294, 1225, 749)),
          }

          for name, (src, box) in crops.items():
              im = Image.open(src).crop(box)
              out = Path("assets") / name
              im.save(out, "PNG", optimize=True)
              print(name, im.size, out.stat().st_size)

          expected = {
              "table1.png": (1904, 1141),
              "figure2.png": (1926, 533),
              "figure3.png": (930, 413),
              "figure4.png": (917, 408),
              "figure5.png": (915, 369),
              "figure6.png": (949, 455),
          }
          for name, size in expected.items():
              assert Image.open(Path("assets") / name).size == size, (name, Image.open(Path("assets") / name).size)
          PY

      - name: Commit corrected crops and remove workflow
        run: |
          set -euo pipefail
          git config user.name "Dongseok Lee"
          git config user.email "103242436+dongseok1220@users.noreply.github.com"
          git rm .github/workflows/replace-crops.yml
          git add assets/table1.png assets/figure2.png assets/figure3.png assets/figure4.png assets/figure5.png assets/figure6.png
          git commit -m "Fix project figure crops"
          git push origin gh-pages
