name: Refresh ReFeri project assets

on:
  push:
    paths:
      - ".github/workflows/refresh-project-assets.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow

      - name: Download camera-ready paper and render pages
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/referi.pdf https://arxiv.org/pdf/2506.17251v3
          mkdir -p /tmp/render
          for p in 2 5 6 7 8; do
            pdftoppm -f "$p" -singlefile -r 300 -png /tmp/referi.pdf "/tmp/render/page$p" >/dev/null 2>&1
          done

      - name: Crop high-resolution figures
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path

          out = Path("assets")
          crops = {
              "figure1.png": ("/tmp/render/page2.png", (285, 270, 2215, 900)),
              "table1.png":  ("/tmp/render/page5.png", (285, 525, 2195, 1645)),
              "figure2.png": ("/tmp/render/page6.png", (275, 275, 2210, 790)),
              "figure3.png": ("/tmp/render/page6.png", (1300, 1585, 2210, 2010)),
              "figure4.png": ("/tmp/render/page7.png", (275, 275, 1240, 675)),
              "figure5.png": ("/tmp/render/page7.png", (1280, 710, 2210, 1105)),
              "figure6.png": ("/tmp/render/page8.png", (285, 280, 1220, 750)),
          }

          for name, (src, box) in crops.items():
              im = Image.open(src).crop(box)
              bg = Image.new(im.mode, im.size, "white")
              diff = ImageChops.difference(im, bg).convert("L")
              bbox = diff.point(lambda p: 255 if p > 8 else 0).getbbox()
              if bbox:
                  l, t, r, b = bbox
                  pad = 18
                  im = im.crop((
                      max(0, l-pad), max(0, t-pad),
                      min(im.width, r+pad), min(im.height, b+pad)
                  ))
              im.save(out / name, "PNG", optimize=True)
              print(name, im.size, (out / name).stat().st_size)

          assert Image.open(out/"figure1.png").width > 1800
          assert Image.open(out/"table1.png").width > 1800
          assert Image.open(out/"figure2.png").width > 1800
          assert Image.open(out/"figure5.png").width > 850
          assert Image.open(out/"figure6.png").width > 850
          PY

      - name: Commit assets and remove workflow
        run: |
          set -euo pipefail
          git config user.name "Dongseok Lee"
          git config user.email "103242436+dongseok1220@users.noreply.github.com"
          git rm .github/workflows/refresh-project-assets.yml
          git add assets/figure1.png assets/table1.png assets/figure2.png assets/figure3.png assets/figure4.png assets/figure5.png assets/figure6.png
          git commit -m "Refresh project figures at high resolution"
          git push origin gh-pages
